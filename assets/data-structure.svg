<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="646" viewBox="0 0 1340 646"><rect width="1340" height="646" fill="#f4f8f2"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="13" fill="#183a3d"><g><rect x="30" y="30" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="30" y="30" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="180" y="52" text-anchor="middle" font-weight="600" font-size="15">案件</text><text x="44" y="92" font-size="12" fill="#4f6d64">依頼1件の目的と対象装置を保存します。</text></g><g><rect x="30" y="290" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="30" y="290" width="300" height="32" rx="3" fill="#f3e6cc" stroke="#b09a70"/><text x="180" y="312" text-anchor="middle" font-weight="600" font-size="15">実行権限</text><text x="44" y="352" font-size="12" fill="#4f6d64">1回の実行に使う権限と使用状況を保存します。</text></g><g><rect x="30" y="520" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="30" y="520" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="180" y="542" text-anchor="middle" font-weight="600" font-size="15">実行記録</text><text x="44" y="582" font-size="12" fill="#4f6d64">1回の実行での各処理の状態を保存します。</text></g><g><rect x="520" y="30" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="520" y="30" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="670" y="52" text-anchor="middle" font-weight="600" font-size="15">試験</text><text x="534" y="92" font-size="12" fill="#4f6d64">試験条件と実施日時を保存します。</text></g><g><rect x="520" y="290" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="520" y="290" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="670" y="312" text-anchor="middle" font-weight="600" font-size="15">原記録</text><text x="534" y="352" font-size="12" fill="#4f6d64">装置から取得した測定ファイルを保存します。</text></g><g><rect x="520" y="520" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="520" y="520" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="670" y="542" text-anchor="middle" font-weight="600" font-size="15">再計算</text><text x="534" y="582" font-size="12" fill="#4f6d64">不合格項目に対する再計算の結果を保存します。</text></g><g><rect x="1010" y="30" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="1010" y="30" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="1160" y="52" text-anchor="middle" font-weight="600" font-size="15">集計</text><text x="1024" y="92" font-size="12" fill="#4f6d64">解析処理が原記録から計算した値を保存します。</text></g><g><rect x="1010" y="290" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="1010" y="290" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="1160" y="312" text-anchor="middle" font-weight="600" font-size="15">照合結果</text><text x="1024" y="352" font-size="12" fill="#4f6d64">チェックリストで照合した結果を保存します。</text></g><g><rect x="1010" y="520" width="300" height="96" rx="3" fill="#fff" stroke="#6f9a8c"/><rect x="1010" y="520" width="300" height="32" rx="3" fill="#dbe9e3" stroke="#6f9a8c"/><text x="1160" y="542" text-anchor="middle" font-weight="600" font-size="15">不合格項目</text><text x="1024" y="582" font-size="12" fill="#4f6d64">不合格になった項目と根拠を保存します。</text></g><g stroke="#3a6d63" stroke-width="1.5" fill="none"><path d="M330 78H520"/><path d="M180 126V290"/><path d="M180 386V520"/><path d="M670 126V290"/><path d="M820 78H1010"/><path d="M1160 126V290"/><path d="M1160 386V520"/><path d="M1010 568H820"/></g><g font-size="12" fill="#2f5c52"><text x="425" y="70" text-anchor="middle">案件ごとの試験</text><text x="915" y="70" text-anchor="middle">試験の集計</text><text x="915" y="560" text-anchor="middle">不合格項目の再計算</text><text x="192" y="212">案件の実行権限</text><text x="192" y="457">実行ごとの記録</text><text x="682" y="212">試験の測定記録</text><text x="1172" y="212">集計の照合</text><text x="1172" y="457">照合の不合格項目</text></g></g></svg>